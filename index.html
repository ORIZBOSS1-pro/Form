<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-container">
    <div class="form-header">
      <h1>Our customer service</h1>
      <h2>Get in Touch</h2>
      <p>Fill the form to send us a message through email, and we'll get back to you as soon as possible.</p>
    </div>

    <!-- Formspree Endpoint Attached -->
    <form id="contact-form" action="https://formspree.io/f/xbglkzyk" method="POST">
      
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="john@example.com" required>
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="Project Inquiry" required>
      </div>

      <div class="form-group">
        <label for="message">Your Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
      </div>

      <button type="submit" id="submit-btn" class="btn">Send Message</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
