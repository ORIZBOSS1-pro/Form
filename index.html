<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="style.css">
  <!-- FontAwesome for UI Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="form-container">
<div class="form-header">
<span class="badge">Customer Service</span>
<h2>Get in Touch</h2>
<p>Fill out the form to send us a direct message, and our team will get back to you shortly.</p>
</div>

<!-- Formspree Endpoint Attached -->
<form id="contact-form" action="https://formspree.io/f/xbglkzyk" method="POST" enctype="multipart/form-data">
      
<div class="form-row">
<div class="form-group">
<label for="name">Full Name <span class="required">*</span></label>
<div class="input-icon-wrapper">
  <i class="fa-regular fa-user input-icon"></i>
<input type="text" id="name" name="name" placeholder="Enter Fullname" required>
</div>
  <span class="error-msg" id="name-error"></span>
</div>

<div class="form-group">
<label for="email">Email Address <span class="required">*</span></label>
<div class="input-icon-wrapper">
  <i class="fa-regular fa-envelope input-icon"></i>
  <input type="email" id="email" name="email" placeholder="john@example.com" required>
</div>
  <span class="error-msg" id="email-error"></span>
</div>
</div>

<div class="form-row">
  <div class="form-group">
 <label for="phone">Phone Number</label>
 <div class="input-icon-wrapper">
  <i class="fa-solid fa-phone input-icon"></i>
  <input type="tel" id="phone" name="phone" placeholder="+234 (012) 345-6789">
  </div>
  </div>
<div class="form-group">
  <label for="service">Inquiry Category</label>
<div class="input-icon-wrapper">
  <i class="fa-solid fa-layer-group input-icon"></i>
  <select id="service" name="service">
    <option value="General Inquiry">General Inquiry</option>
    <option value="Technical Support">Technical Support</option>
    <option value="Billing & Orders">Billing & Orders</option>
    <option value="Feedback">Feedback / Suggestions</option>
  </select>
</div>
</div>
</div>
<div class="form-group">
  <label for="subject">Subject <span class="required">*</span></label>
  <div class="input-icon-wrapper">
  <i class="fa-regular fa-bookmark input-icon"></i>
  <input type="text" id="subject" name="subject" placeholder="Project Inquiry" required>
  </div>
  <span class="error-msg" id="subject-error"></span>
</div>
<div class="form-group">
 <label for="message">Your Message <span class="required">*</span></label>
 <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
 <div class="char-counter"><span id="char-count">0</span> / 500</div>
 <span class="error-msg" id="message-error"></span>
</div>
  <button type="submit" id="submit-btn" class="btn"><span class="btn-text">Send Message</span><i class="fa-solid fa-paper-plane"></i></button>

    <!-- Feedback Status Messages -->
  <div id="form-status" class="form-status"></div>
</form>
  </div>

  <script src="script.js"></script>
</body>
</html>
